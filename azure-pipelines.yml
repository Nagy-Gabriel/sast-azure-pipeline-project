trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    python -m pytest
  displayName: 'Run tests'
  env:
    PYTHONPATH: $(System.DefaultWorkingDirectory)

- script: |
    bandit -r app -f txt -o bandit-report.txt
  displayName: 'Run Bandit SAST scan'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'bandit-report.txt'
    ArtifactName: 'BanditSecurityReport'
    publishLocation: 'Container'
  displayName: 'Publish Bandit report'